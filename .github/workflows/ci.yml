name: CI

# Runs on every push and pull request. release.yml only fires on version tags,
# so this is the workflow that actually guards day-to-day changes.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kept in step with release.yml so CI verifies the toolchain that ships.
  NODE_VERSION: '20'

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Type-check (svelte-check)
        working-directory: frontend
        run: npm run check

      - name: Build
        working-directory: frontend
        run: npm run build

      # The Go binary embeds frontend/dist via //go:embed, so the Go job can't
      # even compile without it. Handing the real build over (rather than
      # stubbing the directory) means that job verifies the actual embed.
      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  go:
    name: Go
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      # Wails links against GTK and WebKit through cgo; without these headers
      # the package doesn't type-check, let alone build. Mirrors release.yml.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      # Cheap and independent of the linter, so it reports a clear "run gofmt"
      # even if the golangci-lint step never gets to run.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt (run 'gofmt -w .' or 'golangci-lint fmt'):"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet -tags webkit2_41 ./...

      - name: Build
        run: go build -tags webkit2_41 ./...

      - name: Test
        run: go test -tags webkit2_41 ./...

      # Reads .golangci.yml. v9 of the action requires golangci-lint v2.1+,
      # which is what that config's `version: "2"` schema targets.
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
